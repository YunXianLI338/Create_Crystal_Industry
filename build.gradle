plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { name = "BlameJared"; url = uri("https://maven.blamejared.com/") }
    maven { name = "Illusive Soulworks"; url = "https://maven.theillusivec4.top/" }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // 指定要使用的 NeoForge 版本。
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 此行是可选的。Access Transformer 会被自动检测
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // 默认的运行配置。
    // 可以按需调整、删除或复制它们。
    runs {
        client {
            client()

            // 以逗号分隔的命名空间列表，用于指定从哪些命名空间加载游戏测试。留空表示全部命名空间。
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 此运行配置会启动 GameTestServer 并运行所有已注册的游戏测试，然后退出。
        // 默认情况下，当没有提供任何游戏测试时，服务器会崩溃。
        // 对于其他运行配置，游戏测试系统也会在 /test 命令下默认启用。
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 覆盖上面 configureEach 中所设置 workingDirectory 的示例，如需使用请取消注释
            // gameDirectory = project.file('run-data')

            // 指定用于数据生成的 modid、生成资源的输出位置，以及查找现有资源的位置。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 适用于上述所有运行配置
        configureEach {
            // 推荐用于 userdev 环境的日志数据
            // 这些标记可以按需添加或删除，以逗号分隔。
            // "SCAN"：用于模组扫描。
            // "REGISTRIES"：用于触发注册表事件。
            // "REGISTRYDUMP"：用于获取所有注册表的内容。
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 推荐的控制台日志级别
            // 你可以在此设置各种级别。
            // 请阅读：https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 定义 mod <-> 源码的绑定关系
        // 这些用于告诉游戏哪些源码属于哪个模组
        // 在单模组项目中大多是可选的
        // 但多模组项目应为每个模组定义一个
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 包含由数据生成器生成的资源。
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // 机械动力依赖
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.27.0.343"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    // AE2 可选联动：仅编译期需要；运行时由开发环境 run/mods 或玩家自行安装的 AE2 提供
    compileOnly "maven.modrinth:ae2:${ae2_version}"
}

// 这段代码会在指定的资源目标中展开所有已声明的替换属性。
// 缺少属性会导致错误。属性使用 ${} 这种 Groovy 语法进行展开。
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// 将 "generateModMetadata" 的输出作为构建的输入目录包含进来
// 无论是通过 Gradle 构建还是在 IDE 中构建，这都有效。
sourceSets.main.resources.srcDir generateModMetadata
// 为了避免手动运行 "generateModMetadata"，让它每次项目重载时都运行
neoForge.ideSyncTask generateModMetadata

// 使用 maven-publish 插件进行发布的示例配置
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA 不再自动下载依赖的源码包/javadoc 包，因此我们需要显式启用该行为。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

