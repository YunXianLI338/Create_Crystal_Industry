# 设置 gradle 命令默认使用的内存。可被用户或命令行属性覆盖。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## 环境属性
# 你可以在这里找到最新版本：https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 Neo 版本一致，才能获得有效的构件
minecraft_version=1.21.1
# Minecraft 版本范围可以使用任意 Minecraft 正式版作为边界。
# 快照版、预发布版和候选发布版不保证能正确排序，
# 因为它们不遵循标准的版本号约定。
minecraft_version_range=[1.21.1,1.22)
# Neo 版本必须与 Minecraft 版本一致，才能获得有效的构件
neo_version=21.1.248
# Neo 版本范围可以使用任意 Neo 版本作为边界
neo_version_range=[21,22)
# 加载器版本范围只能使用 FML 的主版本号作为边界
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
## 模组属性
# 模组的唯一标识符。在英文区域设置下必须为小写。必须符合正则 [a-z][a-z0-9_]{1,63}
# 必须与标注了 @Mod 的主模组类中的 String 常量一致。
mod_id=create_crystal_industry
# 模组的显示名称，供人阅读。
mod_name=Create Crystal Industry
# 模组的许可证。请在 https://choosealicense.com/ 查看你的选项。默认是 All Rights Reserved(保留所有权利)。
mod_license=ARR
# 模组版本。参见 https://semver.org/
mod_version=1.0.0-beta.1
# 模组的组 ID。只有在作为构件发布到 Maven 仓库时才重要。
# 这应当与模组源码使用的基础包名一致。
# 参见 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.minecart
# 模组的作者。这是一个简单的文本字符串，用于在模组列表中显示。
mod_authors=YunXian_LI
# 模组的描述。这是一个简单的多行文本字符串，用于在模组列表中显示。
mod_description=
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
curios_version = 9.2.2
ae2_version=19.2.17
